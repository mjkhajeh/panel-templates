<div class="shp_repeater-item">
	<div class="shp_repeater-item-head">
		<div class="shp_repeater-item-head-title">
			<i class="shp_repeater-item-head-move-icon sheyda-icon-hamburger-menu"></i>
			<span class="shp_repeater-item-head-title-text">{TITLE}</span>
		</div>
		<i class="shp_repeater-item-head-icon sheyda-icon-alt-arrow-down"></i>
	</div>
	<div class="shp_repeater-item-body">
		<input type="hidden" name="shp_repeater-item[{index}]">
		{Content}

		<button type="button" class="shp_repeater-item-remove">{Remove item text - Default: Remove}</button>
	</div>
</div>
