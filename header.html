<div class="shp_header-wrap">
	<div class="shp_header-name-wrap">
		<img class="shp_header-name-img" src="{PANEL LOGO}" alt="{PANEL NAME}">
		<span class="shp_header-name-title">{PANEL NAME}</span>
	</div>
	<div class="shp_header-search-wrap">
		<!-- Search box component -->
		<div class="shp_searchbox-wrap">
			<input type="text" name="search" class="shp_searchbox-input" id="shp_header-search" placeholder="Search...">
			<i class="shp_searchbox-icon sheyda-icon-minimalistic-magnifer"></i>
		</div>
	</div>
	<div class="shp_header-version-wrap">
		<span class="shp_header-version-title">Version: {PANEL VERSION}</span>
	</div>
</div>
